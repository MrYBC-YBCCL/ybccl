
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore the Lists | YBC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101116;
            color: white;
        }

        header {
            padding: 22px 8%;
            background: #18191f;
            border-bottom: 1px solid #292a33;
        }

        header h2 {
            margin: 0;
            color: #e34450;
            letter-spacing: 2px;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 75px 24px;
            text-align: center;
        }

        main > h1 {
            color: white;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #a5a7b0;
            margin-bottom: 42px;
        }

        .lists {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .list-button {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            min-height: 190px;
            padding: 25px 20px;

            background: #1b1d25;
            border: 1px solid #343641;
            border-radius: 14px;

            color: white;
            text-decoration: none;

            transition: transform 0.2s, border-color 0.2s, background 0.2s;
        }

        .list-button:hover {
            transform: translateY(-5px);
            border-color: #e34450;
            background: #25202a;
        }

        .list-button h2 {
            margin: 0 0 12px;
            color: #e34450;
            font-size: 28px;
        }

        .list-button p {
            color: #b9bac3;
            line-height: 1.5;
            margin: 0;
        }

        .list-button .description {
            margin-top: 10px;
            font-size: 13px;
            color: #858894;
        }

        /* COMING SOON CARD */

        .coming-soon {
            cursor: default;
        }

        .coming-soon:hover {
            transform: none;
            border-color: #343641;
            background: #1b1d25;
        }

        .coming-soon h2 {
            color: #e34450;
        }

        .coming-soon .description {
            margin-top: 10px;
            font-size: 13px;
            color: #858894;
        }

        /* BACK BUTTON */

        .back {
            display: inline-block;
            margin-top: 35px;
            color: #b9bac3;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back:hover {
            color: #e34450;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            .lists {
                grid-template-columns: 1fr;
            }

            main {
                padding: 45px 18px;
            }

            .list-button {
                min-height: 150px;
            }
        }

    </style>
</head>

<body>

    <header>
        <h2>YBC LISTS</h2>
    </header>

    <main>

        <h1>Explore the Lists</h1>

        <p class="subtitle">
            Choose a leaderboard to explore.
        </p>

        <div class="lists">

            <!-- YBCCL -->

            <a href="leaderboard.html" class="list-button">
                <h2>YBCCL</h2>
                <p>YBC Challenge List</p>
            </a>

            <!-- YBCPL -->

            <a href="ybcpl.html" class="list-button">
                <h2>YBCPL</h2>
                <p>YBC Platformer List</p>
            </a>

            <!-- YBCSPCL -->

            <a href="spam.html" class="list-button">
                <h2>YBCSPCL</h2>
                <p>YBC Spam Challenge List</p>
            </a>

            <!-- YBCILR -->

            <a href="ybcirl.html" class="list-button">
                <h2>YBCILR</h2>
                <p>YBC Impossible Levels Records</p>
         
            </a>

            <!-- COMING SOON -->

            <div class="list-button coming-soon">
                <h2>Coming Soon</h2>
                <p>A new YBC list is currently in development.</p>
            </div>

        </div>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </main>

</body>
</html>
