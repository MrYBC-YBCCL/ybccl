
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge | YBCPL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101116;
    color: white;
}

header {
    background: #17181f;
    border-bottom: 2px solid #d83232;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: #ff4545;
    font-size: 25px;
    font-weight: bold;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

nav a {
    color: #ddd;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
}

nav a:hover {
    background: #d83232;
    color: white;
}

.container {
    width: 90%;
    max-width: 1050px;
    margin: 40px auto;
}

.back {
    color: #ff5555;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 22px;
    font-size: 14px;
}

.back:hover {
    text-decoration: underline;
}

.hero {
    background: linear-gradient(135deg, #251719, #171820);
    border: 1px solid #392326;
    border-left: 5px solid #e33b3b;
    border-radius: 10px;
    padding: 30px;
    margin-bottom: 20px;
}

.rank {
    color: #ff5555;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
}

h1 {
    font-size: 36px;
    margin: 0;
    overflow-wrap: anywhere;
}

.points {
    display: inline-block;
    margin-top: 17px;
    background: #351d21;
    border: 1px solid #773238;
    color: #ff6262;
    padding: 9px 15px;
    border-radius: 6px;
    font-weight: bold;
}

.panel {
    background: #191a22;
    border: 1px solid #292a34;
    border-radius: 9px;
    padding: 25px;
    margin-bottom: 20px;
}

.panel h2 {
    font-size: 19px;
    margin: 0 0 20px;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.detail {
    background: #121319;
    border: 1px solid #292a34;
    border-radius: 7px;
    padding: 16px;
    min-width: 0;
}

.detail-label {
    color: #999;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 9px;
}

.detail-value {
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.description, .note {
    color: #ccc;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.rating {
    color: #ff5555;
    font-size: 24px;
    font-weight: bold;
}

.loading, .error {
    background: #191a22;
    border: 1px solid #292a34;
    border-radius: 9px;
    padding: 30px;
    text-align: center;
    color: #aaa;
}

.error {
    color: #ff6666;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: 13px;
    border-top: 1px solid #292a34;
    margin-top: 50px;
}

@media (max-width: 600px) {
    header {
        padding: 18px 5%;
    }

    .container {
        width: 94%;
        margin-top: 25px;
    }

    .hero {
        padding: 23px;
    }

    h1 {
        font-size: 28px;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 19px;
    }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="ybcpl.html">YBCPL</a>

    <nav>
        <a href="index.html">YBCCL</a>
        <a href="ybcpl.html">Platformer</a>
        <a href="ybcpl-leaderboard.html">Players</a>
        <a href="spam.html">Spam List</a>
    </nav>
</header>

<main class="container">

    <a href="ybcpl.html" class="back">← Back to YBCPL</a>

    <div id="content">
        <div class="loading">Loading challenge...</div>
    </div>

</main>

<footer>
    YBC Platformer List · Part of the YBC community
</footer>

<script>
const SUPABASE_URL = "https://hdsorzrcvvyakckbgegk.supabase.co";
const SUPABASE_KEY = "sb_publishable__RCrx7HGA5RDkv0t63O0sg_JNT-qk8P";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

async function loadChallenge() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const content = document.getElementById("content");

    if (!id) {
        content.innerHTML = `
            <div class="error">
                No challenge ID was provided.
                <br><br>
                <a class="back" href="ybcpl.html">Return to YBCPL</a>
            </div>
        `;
        return;
    }

    const { data, error } = await db
        .from("ybcpl_challenges")
        .select("*")
        .eq("id", id)
        .single();

    if (error || !data) {
        content.innerHTML = `
            <div class="error">
                Couldn't load this challenge.
                <br><br>
                It may have been removed or the ID may be invalid.
                <br><br>
                <a class="back" href="ybcpl.html">Return to YBCPL</a>
            </div>
        `;
        return;
    }

    document.title = `${data.name} | YBCPL`;

    content.innerHTML = `
        <section class="hero">
            <div class="rank">RANK #${escapeHTML(data.position)}</div>
            <h1>${escapeHTML(data.name)}</h1>
            <div class="points">
                ${Number(data.points || 0).toLocaleString()} points
            </div>
        </section>

        <section class="panel">
            <h2>Challenge <span style="color:#ff4545">Information</span></h2>

            <div class="details">
                <div class="detail">
                    <div class="detail-label">Creator</div>
                    <div class="detail-value">${escapeHTML(data.creator || "Unknown")}</div>
                </div>

                <div class="detail">
                    <div class="detail-label">Verifier</div>
                    <div class="detail-value">${escapeHTML(data.verifier || "Unknown")}</div>
                </div>

                <div class="detail">
                    <div class="detail-label">Level ID</div>
                    <div class="detail-value">${escapeHTML(data.level_id || "Not provided")}</div>
                </div>

                <div class="detail">
                    <div class="detail-label">Enjoyment Rating</div>
                    <div class="rating">
                        ${data.enjoyment_rating === null
                            ? "Not rated"
                            : escapeHTML(data.enjoyment_rating) + "/100"}
                    </div>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2>Challenge <span style="color:#ff4545">Description</span></h2>
            <div class="description">${
                escapeHTML(data.description || "No description has been provided.")
            }</div>
        </section>

        <section class="panel">
            <h2>Verifier's <span style="color:#ff4545">Note</span></h2>
            <div class="note">${
                escapeHTML(data.verifier_note || "No verifier's note has been provided.")
            }</div>
        </section>
    `;
}

loadChallenge();
</script>

</body>
</html>
