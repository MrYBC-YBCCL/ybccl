
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBC Forehead | YBCCL</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0d12;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        header {
            background: #0e1016;
            border-bottom: 1px solid #252b38;
            padding: 20px 4%;
        }

        header a {
            color: #ed414b;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
        }

        .hero {
            text-align: center;
            padding: 55px 0 30px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 span {
            color: #ed414b;
        }

        .subtitle {
            color: #939bad;
            font-size: 15px;
        }

        /* IMAGE AREA */

        .image-container {
            width: 100%;
            height: 650px;
            margin: 30px auto 60px;
            background: #12151d;
            border: 2px dashed #ed414b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder {
            color: #626b7d;
            font-size: 18px;
            text-align: center;
        }

        footer {
            border-top: 1px solid #252b38;
            padding: 25px;
            text-align: center;
            color: #939bad;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 32px;
            }

            .image-container {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html">&larr; Back to YBCCL</a>
    </header>

    <main class="container">

        <section class="hero">
            <h1>YBC <span>Forehead</span></h1>
            <p class="subtitle">
                The legendary YBC Forehead.
            </p>
        </section>

        <div class="image-container">

           <img src="images/forehead.jpg" alt="YBC Forehead">
            

        </div>

    </main>

    <footer>
        YBCCL &mdash; YBC Challenge List
    </footer>

</body>
</html>
